<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#124CC4">
<title>S2 My stakes | Cojam</title>
<link rel="icon" href="assets/cojam-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-jp-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/components.css">
<link rel="stylesheet" href="assets/screens/money.css">
</head>
<body>
<!-- S2 My stakes. States: (none), claimable, unlocking (flips while you watch), claim (success sheet), loading, empty, error, offline, hold (account on hold: claim and withdraw work, the fee is paid in KAIA), hold-nokaia (on hold with too little KAIA for the fee). Add ?lang=en|ko|ja. Mock data only. -->
<noscript>Cojam needs JavaScript to show this screen.</noscript>
<script src="assets/i18n.js"></script>
<script src="assets/mock.js"></script>
<script src="assets/components.js"></script>
<script>
(function () {
  var t = App.t, F = App.fmt, S = App.state, M = MOCK, $ = App.$;
  var DAY = 86400000, YEAR = 365 * 86400;
  var stakes = M.stakes.slice();
  var hold = /^hold/.test(S), kaia = S === "hold-nokaia" ? 0.0004 : M.user.kaia, noKaia = hold && kaia < M.fee, HQ = hold ? "?state=hold" : "";
  if (S === "claimable" || S === "claim" || hold) stakes.unshift(M.stakeBig);
  if (S === "unlocking") stakes[0] = { id: "u", amount: 1000, days: 90, rate: 13, start: new Date(Date.now() - 90 * DAY + 6000) };
  function calc(s) {
    var el = Math.min((Date.now() - s.start) / 1000, s.days * 86400), per = s.amount * s.rate / 100 / YEAR;
    return { interest: per * el, per: per, cap: per * s.days * 86400, day: Math.min(s.days, Math.floor(el / 86400) + 1), unlocked: el >= s.days * 86400, unlock: new Date(+s.start + s.days * DAY), pct: Math.min(100, el / (s.days * 864)) };
  }
  var total = stakes.reduce(function (a, s) { return a + s.amount; }, 0);
  var sofar = stakes.reduce(function (a, s) { return a + calc(s).interest; }, 0), perAll = stakes.reduce(function (a, s) { var c = calc(s); return a + (c.unlocked ? 0 : c.per); }, 0);
  var claimable = stakes.reduce(function (a, s) { var c = calc(s); return a + (c.unlocked || c.interest >= M.minClaim ? c.interest : 0); }, 0);

  function head() { return '<div class="ph-top"><h1>' + t("s.title") + "</h1></div>"; }
  /* two pages, so two tabs standing on the ink rule; the number of open stakes is a real count, in a chip */
  function sw() { return '<nav class="mtabs" id="sw" aria-label="' + App.esc(t("s.switch")) + '"><a href="staking.html' + HQ + '">' + t("s.new") + '</a><a href="stakes.html' + (hold ? "?state=" + S : "") + '" aria-current="page">' + t("s.tab.mine") + '<span class="mtabs-n">' + (S === "empty" ? 0 : stakes.length) + "</span></a></nav>"; }
  function out(s) { return Math.round((s.amount + calc(s).interest) * 1e4) / 1e4; }
  /* one stake is one section under the ink rule: what is locked and its state, how far along it is, what it has earned, and the action when there is one */
  /* on hold the player pays the network fee: the line under each action says so, and with too little KAIA the action is off */
  var feeLine = hold ? '<p class="hold-why" data-fee-line>' + C.icon("info", 16) + "<span>" + t("hold.fee.line") + " (" + t("x.fee.v", { f: M.fee }) + ")</span></p>" : "";
  function card(s) {
    var c = calc(s), actions;
    /* the button states everything that leaves the stake: principal plus interest, and the line under it shows the two parts */
    if (c.unlocked) actions = '<div class="mstake-acts" data-actions>' + C.btn(t("m.withdraw", { a: F.dec(out(s), 4) }), { kind: "primary", block: true, attrs: 'data-wd="' + s.id + '"', disabled: App.offline || noKaia }) + '<p class="tiny muted center">' + t("m.withint", { p: F.dec(s.amount), i: F.dec(c.interest, 4) }) + "</p>" + feeLine + "</div>";
    else if (c.interest >= M.minClaim) actions = '<div class="mstake-acts" data-actions>' + C.btn(t("m.claim", { i: F.dec(c.interest, 2) }), { block: true, attrs: 'data-claim="' + s.id + '"', disabled: App.offline || noKaia }) + feeLine + "</div>";
    /* under the 10 CT minimum there is nothing to press, so there is no button: only how far it is */
    else actions = '<p class="mstake-gap" data-actions>' + t("m.claim.gap", { g: F.dec(M.minClaim - c.interest, 2) }) + "</p>";
    return '<article class="msec stake mstake" data-stake="' + s.id + '"><div class="mstake-top"><div><p class="fig">' + F.dec(s.amount) + '<small>CT</small></p><p class="small muted">' + t("m.card.period", { d: s.days, r: s.rate }) + "</p></div>" +
      '<span data-status>' + (c.unlocked ? C.tag(t("m.unlocked"), "sky") : C.tag(t("m.locked"), "", "lock")) + "</span></div>" +
      '<div class="stack-8"><div class="mbar' + (c.unlocked ? " is-full" : "") + '" role="img" aria-label="' + t("m.day", { x: c.day, d: s.days }) + '"><i style="width:' + c.pct.toFixed(1) + '%"></i></div>' +
      '<div class="mbar-meta"><span>' + t("m.started", { date: F.date(s.start) }) + "</span><b>" + t("m.day", { x: c.day, d: s.days }) + "</b><span>" + t("m.unlocks", { date: F.date(c.unlock) }) + "</span></div></div>" +
      C.rows([[t("m.interest"), '<span data-tick="' + c.interest + "|" + (c.unlocked ? 0 : c.per) + "|" + c.cap + '">' + fix4(c.interest) + "</span> CT" + (App.offline ? "<small>" + t("m.paused") + "</small>" : ""), true]]) +
      actions + "</article>";
  }
  function body() {
    if (S === "error") return sw() + C.error();
    if (S === "empty") return sw() + C.empty({ icon: "lock", title: t("m.empty.h"), body: t("m.empty.b"), action: C.btn(t("m.empty.btn"), { kind: "primary", href: "staking.html" }) });
    if (S === "loading") return sw() + '<section class="msec" aria-busy="true">' + C.skel("90px") + C.skel("170px", "44px") + C.skel("70%", "22px") + "</section>" + [1, 2].map(function () { return '<article class="msec" aria-busy="true">' + C.skel("120px", "28px") + C.skel("100%", "14px") + C.skel("100%") + C.skel("100%", "44px") + "</article>"; }).join("");
    return sw() +
      (hold ? C.hold(t("hold.stakes")) + (noKaia ? C.note("error", t("hold.nokaia", { f: M.fee, k: F.dec(kaia, 4) }), C.btn(t("x.fix.kaia"), { sm: true, href: "deposit.html", id: "get-kaia" })) : "") : "") +
      /* the total leads; under it the two interest figures side by side, both to four places, as on every other screen, so they read as one pair (the first one ticks) */
      '<section class="msec" id="total"><div class="mhero"><h2 class="lbl">' + t("m.staked") + '</h2><p class="fig">' + F.dec(total) + "<small>CT</small></p></div>" +
      '<div class="stats mstats"><div class="stat"><b><span data-tick="' + sofar + "|" + perAll + '">' + fix4(sofar) + "</span></b><span>" + t("m.sofar") + ' (CT)</span></div><div class="stat"><b>' + fix4(claimable) + "</b><span>" + t("m.claimable") + " (CT)</span></div></div>" +
      (hold ? C.rows([[t("x.kaia"), F.kaia(kaia)], [t("x.fee"), t("x.fee.v", { f: M.fee })]]) : "") + "</section>" +
      stakes.map(card).join("") +
      C.help(t("m.closed.q", { n: M.stakesClosed.length }), M.stakesClosed.map(function (s) { return '<div class="mclosed"><div class="row-between"><span>' + F.ct(s.amount) + ", " + t("m.card.period", { d: s.days, r: s.rate }) + "</span>" + C.tag(t("m.closed"), "line") + '</div><p class="tiny">' + t("m.paidout", { a: F.dec(s.paid, 2) }) + "</p></div>"; }).join(""));
  }
  function fix4(n) { return Number(n).toLocaleString("en-US", { minimumFractionDigits: 4, maximumFractionDigits: 4 }); }
  function find(id) { return stakes.filter(function (s) { return s.id === id; })[0]; }
  App.mount({ tab: "stake", docTitle: t("s.title"), head: head(), body: body(), badges: { home: "dot", results: 2, stake: "dot" }, after: function () {
    document.addEventListener("click", function (e) {
      var c = e.target.closest("[data-claim]"), w = e.target.closest("[data-wd]");
      /* on hold every claim and withdrawal is reviewed first: the sheet states the fee, who pays it and the KAIA balance */
      function rv(title, amount) { return hold ? { title: title, rows: [[t("x.amount"), amount], [t("x.fee"), t("x.fee.v", { f: M.fee })], [t("x.kaia"), F.kaia(kaia)]], note: t("hold.fee.line") + ". " + t("hold.fee.rv"), confirm: t("tx.confirm") } : null; }
      if (c) { var s = find(c.getAttribute("data-claim")), i = F.dec(calc(s).interest, 2); App.tx.run({ label: t("m.chip.claim", { i: i }), review: rv(t("m.claim", { i: i }), F.ct(calc(s).interest)), success: { title: t("m.ok.claim", { i: i }) } }); }
      if (w) { var s2 = find(w.getAttribute("data-wd")), a = F.dec(out(s2), 4); App.tx.run({ label: t("m.chip.wd", { a: a }), review: rv(t("m.withdraw", { a: a }), F.ct(out(s2))), success: { title: t("m.ok.wd", { a: a }) }, onDone: function () { var el = $('[data-stake="' + s2.id + '"]'); if (el) el.remove(); } }); }
    });
    if (S === "claim") App.tx.show("success", { label: "", success: { title: t("m.ok.claim", { i: "263.01" }) } });
    if (S === "unlocking") setTimeout(function () {   /* the unlock moment: tag flips and the withdraw button appears, no reload */
      var s = stakes[0], el = $('[data-stake="u"]'); if (!el) return;
      el.outerHTML = card(s); App.enhance(document.body); App.live(t("m.unlocked"));
    }, 6500);
  } });
})();
</script>
</body>
</html>
