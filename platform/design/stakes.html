<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#124CC4">
<title>S2 My stakes | Cojam</title>
<link rel="icon" href="assets/cojam-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-jp-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/components.css">
</head>
<body>
<!-- S2 My stakes. States: (none), claimable, unlocking (flips while you watch), claim (success sheet), loading, empty, error, offline. Add ?lang=en|ko|ja. Mock data only. -->
<noscript>Cojam needs JavaScript to show this screen.</noscript>
<script src="assets/i18n.js"></script>
<script src="assets/mock.js"></script>
<script src="assets/components.js"></script>
<script>
(function () {
  var t = App.t, F = App.fmt, S = App.state, M = MOCK, $ = App.$;
  var DAY = 86400000, YEAR = 365 * 86400;
  var stakes = M.stakes.slice();
  if (S === "claimable" || S === "claim") stakes.unshift(M.stakeBig);
  if (S === "unlocking") stakes[0] = { id: "u", amount: 1000, days: 90, rate: 13, start: new Date(Date.now() - 90 * DAY + 6000) };
  function calc(s) {
    var el = Math.min((Date.now() - s.start) / 1000, s.days * 86400), per = s.amount * s.rate / 100 / YEAR;
    return { interest: per * el, per: per, cap: per * s.days * 86400, day: Math.min(s.days, Math.floor(el / 86400) + 1), unlocked: el >= s.days * 86400, unlock: new Date(+s.start + s.days * DAY), pct: Math.min(100, el / (s.days * 864)) };
  }
  var total = stakes.reduce(function (a, s) { return a + s.amount; }, 0);
  var sofar = stakes.reduce(function (a, s) { return a + calc(s).interest; }, 0), perAll = stakes.reduce(function (a, s) { var c = calc(s); return a + (c.unlocked ? 0 : c.per); }, 0);
  var claimable = stakes.reduce(function (a, s) { var c = calc(s); return a + (c.unlocked || c.interest >= M.minClaim ? c.interest : 0); }, 0);

  function head() { return "<div><h1>" + t("s.title") + '</h1><p class="ph-sub">' + t("s.sub") + "</p></div>"; }
  function sw() { return C.seg([{ label: t("s.new"), href: "staking.html" }, { label: t("s.mine", { n: S === "empty" ? 0 : stakes.length }), href: "stakes.html", on: true }], { label: t("s.switch") }); }
  function card(s) {
    var c = calc(s), actions;
    if (c.unlocked) actions = C.btn(t("m.withdraw", { a: F.dec(s.amount) }), { kind: "primary", block: true, attrs: 'data-wd="' + s.id + '"', disabled: App.offline }) + '<p class="tiny muted center">' + t("m.withint", { i: F.dec(c.interest, 4) }) + "</p>";
    else if (c.interest >= M.minClaim) actions = C.btn(t("m.claim", { i: F.dec(c.interest, 2) }), { block: true, attrs: 'data-claim="' + s.id + '"', disabled: App.offline });
    else actions = C.btn(t("m.claim", { i: F.dec(c.interest, 2) }), { block: true, disabled: true }) + '<p class="tiny muted center">' + t("m.claim.gap", { g: F.dec(M.minClaim - c.interest, 2) }) + "</p>";
    return '<article class="card stake" data-stake="' + s.id + '"><div class="stake-top"><div><p class="fig fig--md">' + F.dec(s.amount) + '<small>CT</small></p><p class="small muted">' + t("m.card.period", { d: s.days, r: s.rate }) + "</p></div>" +
      '<span data-status>' + (c.unlocked ? C.tag(t("m.unlocked"), "volt") : C.tag(t("m.locked"), "ink", "lock")) + "</span></div>" +
      '<div class="stack-8"><div class="bar' + (c.unlocked ? " is-full" : "") + '" role="img" aria-label="' + t("m.day", { x: c.day, d: s.days }) + '"><i style="width:' + c.pct.toFixed(1) + '%"></i></div>' +
      '<div class="row-between tiny muted"><span>' + t("m.started", { date: F.date(s.start) }) + "</span><span>" + t("m.day", { x: c.day, d: s.days }) + "</span><span>" + t("m.unlocks", { date: F.date(c.unlock) }) + "</span></div></div>" +
      C.rows([[t("m.interest"), '<span data-tick="' + c.interest + "|" + (c.unlocked ? 0 : c.per) + "|" + c.cap + '">' + F.dec(c.interest, 6) + "</span> CT" + (App.offline ? "<small>" + t("m.paused") + "</small>" : ""), true]]) +
      '<div class="stack-8" data-actions>' + actions + "</div></article>";
  }
  function body() {
    if (S === "error") return sw() + C.error();
    if (S === "empty") return sw() + C.empty({ icon: "lock", title: t("m.empty.h"), body: t("m.empty.b"), action: C.btn(t("m.empty.btn"), { kind: "primary", href: "staking.html" }) });
    if (S === "loading") return sw() + '<section class="card card--ink stack-12" aria-busy="true">' + C.skel("90px") + C.skel("170px", "34px") + C.skel("100%", "52px") + "</section>" + [1, 2].map(function () { return '<article class="card stack-12" aria-busy="true">' + C.skel("120px", "26px") + C.skel("100%", "10px") + C.skel("100%") + C.skel("100%", "44px", "border-radius:999px") + "</article>"; }).join("");
    return sw() +
      '<section class="card card--ink stack-12"><div><p class="card-h">' + t("m.staked") + '</p><p class="fig fig--xl">' + F.dec(total) + "<small>CT</small></p></div>" +
      '<div class="two"><div class="stat"><b><span data-tick="' + sofar + "|" + perAll + '">' + F.dec(sofar, 6) + "</span></b><span>" + t("m.sofar") + ' (CT)</span></div><div class="stat"><b>' + F.dec(claimable, 2) + "</b><span>" + t("m.claimable") + " (CT)</span></div></div></section>" +
      stakes.map(card).join("") +
      C.help(t("m.closed.q", { n: M.stakesClosed.length }), M.stakesClosed.map(function (s) { return '<div class="row-between"><span>' + F.ct(s.amount) + ", " + t("m.card.period", { d: s.days, r: s.rate }) + "</span>" + C.tag(t("m.closed"), "line") + '</div><p class="tiny">' + t("m.paidout", { a: F.dec(s.paid, 2) }) + "</p>"; }).join(""));
  }
  function find(id) { return stakes.filter(function (s) { return s.id === id; })[0]; }
  App.mount({ tab: "stake", docTitle: t("s.title"), head: head(), body: body(), badges: { home: "dot", results: 2, stake: "dot" }, after: function () {
    document.addEventListener("click", function (e) {
      var c = e.target.closest("[data-claim]"), w = e.target.closest("[data-wd]");
      if (c) { var s = find(c.getAttribute("data-claim")), i = F.dec(calc(s).interest, 2); App.tx.run({ label: t("m.chip.claim", { i: i }), success: { title: t("m.ok.claim", { i: i }) } }); }
      if (w) { var s2 = find(w.getAttribute("data-wd")), a = F.dec(s2.amount); App.tx.run({ label: t("m.chip.wd", { a: a }), success: { title: t("m.ok.wd", { a: a }) }, onDone: function () { var el = $('[data-stake="' + s2.id + '"]'); if (el) el.remove(); } }); }
    });
    if (S === "claim") App.tx.show("success", { label: "", success: { title: t("m.ok.claim", { i: "263.01" }) } });
    if (S === "unlocking") setTimeout(function () {   /* the unlock moment: tag flips and the withdraw button appears, no reload */
      var s = stakes[0], el = $('[data-stake="u"]'); if (!el) return;
      el.outerHTML = card(s); App.enhance(document.body); App.live(t("m.unlocked"));
    }, 6500);
  } });
})();
</script>
</body>
</html>
