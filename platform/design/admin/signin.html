<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in · Cojam admin</title>
<link rel="icon" href="../assets/cojam-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-jp-dynamic-subset.min.css">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<!-- AD0 Admin sign in. States: ?state=sending | code | wrongcode | expired | notallowed | failed | idle -->
<div class="auth">
  <header class="auth-top"><span class="chip-logo"><img src="../assets/cojam-mark.svg" alt="">Cojam</span><span class="top-name">Admin</span></header>
  <main class="auth-main"><div class="panel" id="panel"></div>
    <div class="phone"><h1>Open the admin on a computer</h1><p>The Cojam admin is built for a wide screen. Open admin.cojam.app on a laptop or desktop, at least 1024 pixels wide.</p><p>Is something urgent? Write to <a href="mailto:help@cojam.app">help@cojam.app</a>.</p></div>
  </main>
</div>
<script>
(function () {
  "use strict";
  var st = new URLSearchParams(location.search).get("state") || "", el = document.getElementById("panel");
  var warn = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l9.5 16.5h-19L12 3.5zM12 10v4.5M12 17.5v.5"/></svg>';
  function err(id, t) { return '<p class="err" id="' + id + '" role="alert">' + warn + t + "</p>"; }
  var codeStep = st === "code" || st === "wrongcode" || st === "expired", mail = st === "notallowed" ? "minji@naver.com" : st ? "ops@cojam.app" : "";
  var foot = '<p class="auth-foot">Only emails on the admin allow list can sign in. The list is kept by the Owner role in System. The session ends after 30 minutes without activity.</p>';
  if (!codeStep) {
    el.innerHTML = '<h1>Cojam admin</h1>' +
      (st === "idle" ? '<div class="note" data-k="sky"><div>You were signed out after 30 minutes without activity.</div></div>' : "") +
      '<p>Sign in with an approved email.</p><form class="stack" onsubmit="location.search=\'state=code\';return false"><div class="fl"><label for="em">Email</label><input class="inp" id="em" type="email" autocomplete="email" placeholder="you@cojam.app" value="' + mail + '"' + (st === "notallowed" || st === "failed" ? ' aria-invalid="true" aria-describedby="em-e"' : "") + (st === "sending" ? " readonly" : " autofocus") + ">" +
      (st === "notallowed" ? err("em-e", "This email is not approved for the admin.") : st === "failed" ? err("em-e", "Sign in failed. Try again.") : "") + "</div>" +
      (st === "sending" ? '<button type="button" class="btn btn-primary is-busy" disabled><span class="spin"></span>Sending the code</button>' : '<button type="submit" class="btn btn-primary">Send code</button>') + "</form>" +
      (st === "notallowed" ? '<p class="hint">No code was sent. If you should have access, ask an Owner to add this address, or write to <a href="mailto:help@cojam.app">help@cojam.app</a>.</p>' : "") + foot;
  } else {
    el.innerHTML = '<h1>Enter the code</h1><p>We sent a 6 digit code to <b>ops@cojam.app</b>. It is valid for 10 minutes.</p><form class="stack" onsubmit="location.href=\'index.html\';return false"><div class="fl"><label for="cd">Code</label><input class="inp code" id="cd" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" value="' + (st === "wrongcode" ? "418207" : st === "expired" ? "550913" : "") + '"' + (st !== "code" ? ' aria-invalid="true" aria-describedby="cd-e"' : "") + " autofocus>" +
      (st === "wrongcode" ? err("cd-e", "That code is not right.") : st === "expired" ? err("cd-e", "This code has expired. Send a new code.") : "") + "</div>" +
      '<button type="submit" class="btn btn-primary">Sign in</button></form><div class="acts" style="justify-content:space-between"><a class="link" href="?">Use another email</a>' + (st === "expired" ? '<a class="link" href="?state=code">Send a new code</a>' : '<span class="hint">Send again in 0:42</span>') + "</div>" + foot;
  }
})();
</script>
</body>
</html>
