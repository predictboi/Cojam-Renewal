<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#124CC4">
<title>A1 Login (email, then a one time code, then "Setting up your game") | Cojam</title>
<link rel="icon" href="assets/cojam-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-jp-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/components.css">
</head>
<body>
<!-- A1 Login (email, then a one time code, then "Setting up your game"). States: (none) email, empty, bademail, unsupported, toomany, sendfail, sending, code, verifying, wrong, expired, tries, setup, returning, busy, walletfail, devicefail, refused-used, refused-provider, refused-many, refused, offline. Add ?lang=en|ko|ja. Mock data only. -->
<noscript>Cojam needs JavaScript to show this screen.</noscript>
<script src="assets/i18n.js"></script>
<script src="assets/mock.js"></script>
<script src="assets/components.js"></script>
<script>
(function () {
  var t = App.t, S = App.state, M = MOCK, $ = App.$;
  var CODE = ["code", "verifying", "wrong", "expired", "tries"], SETUP = ["setup", "returning", "busy", "walletfail", "devicefail", "refused-used", "refused-provider", "refused-many", "refused"];
  var email = { bademail: "minji@naver", unsupported: "minji@proton.me", empty: "", "": "", offline: "" }[S];
  if (email === undefined) email = M.user.email;
  var step = CODE.indexOf(S) >= 0 ? "code" : SETUP.indexOf(S) >= 0 ? "setup" : "email";
  var off = S === "offline", providers = '<span translate="no">' + M.providerNames + "</span>";

  /* returns { text } for a plain field error, or { note } for the provider note */
  function emailErr(v) {
    if (!v) return { text: t("a.email.empty") };
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) return { text: t("a.email.bad") };
    if (M.emailProviders.indexOf(v.split("@")[1].toLowerCase()) < 0) return { note: true };
    return null;
  }
  function emailView() {
    var sending = S === "sending", err = S === "empty" || S === "bademail" || S === "unsupported" ? emailErr(email) : null;
    var msg = err && err.text ? err.text : S === "toomany" ? t("a.email.toomany") : S === "sendfail" ? t("a.email.sendfail") : off ? t("a.offline") : "";
    var bad = !!err || S === "toomany" || S === "sendfail";
    return '<form class="stack" id="f-email" novalidate><div class="field"><div class="field-label"><label for="email"><b>' + t("a.email.label") + '</b></label></div>' +
      '<div class="field-box field-box--text' + (bad ? " is-error" : "") + (off ? " is-off" : "") + '">' + C.icon("mail", 20) + '<input id="email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="you@example.com" value="' + email + '" aria-describedby="email-msg"' + (bad ? ' aria-invalid="true"' : "") + (off || sending ? " disabled" : "") + "></div>" +
      '<div class="field-msg' + (bad ? " is-error" : "") + '" id="email-msg" aria-live="polite">' + (msg ? "<span>" + msg + "</span>" : "") + "</div>" +
      (err && err.note ? '<div class="note note-warn" role="alert" id="prov-note">' + C.icon("warn", 18) + '<div class="note-body"><b>' + t("a.email.unsupported") + "</b><span>" + t("a.email.supported", { list: providers }) + "</span></div></div>" : "") + "</div>" +
      '<button type="submit" class="btn btn-primary btn-block' + (sending ? " is-loading" : "") + '"' + (off ? " disabled" : "") + ">" + (sending ? '<span class="spin"></span>' : "") + "<span>" + t(sending ? "a.email.sending" : "a.email.btn") + "</span></button></form>" +
      C.help(t("a.which.q"), "<p>" + t("a.which.a", { list: providers }) + "</p>") + C.help(t("a.help.q"), "<p>" + t("a.help.a") + "</p>") + '<p class="fine">' + t("a.fine") + "</p>";
  }
  function codeView() {
    var err = S === "wrong" ? t("a.code.wrong") : S === "expired" ? t("a.code.expired") : S === "tries" ? t("a.code.tries") : "", busy = S === "verifying", locked = S === "tries";
    return '<form class="stack" id="f-code" novalidate><div class="stack-8"><h2>' + t("a.code.h") + '</h2><p class="muted">' + t("a.code.body", { email: '<b translate="no">' + App.esc(email) + "</b>" }) + "</p></div>" +
      '<div class="field"><div class="field-box field-box--code' + (err ? " is-error" : "") + (locked ? " is-off" : "") + '"><input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*" placeholder="000000" value="' + (S === "wrong" || S === "tries" ? "418205" : busy ? "418250" : "") + '" aria-label="' + App.esc(t("a.code.label")) + '" aria-describedby="code-msg"' + (err ? ' aria-invalid="true"' : "") + (busy || locked ? " disabled" : "") + "></div>" +
      '<div class="field-msg' + (err ? " is-error" : "") + '" id="code-msg" aria-live="polite">' + (err ? "<span>" + err + "</span>" : "") + "</div></div>" +
      '<button type="submit" class="btn btn-primary btn-block' + (busy ? " is-loading" : "") + '"' + (S === "expired" || locked ? " disabled" : "") + ">" + (busy ? '<span class="spin"></span>' : "") + "<span>" + t(busy ? "a.code.verifying" : "a.code.btn") + "</span></button></form>" +
      '<div class="stack-8"><p class="small muted" id="resend-in"' + (S === "expired" ? " hidden" : "") + ">" + t("a.code.resendin", { s: 60 }) + '</p><div class="row-between"><button type="button" class="linkish" id="resend"' + (S === "expired" ? "" : " disabled") + ">" + t("a.code.resend") + '</button><button type="button" class="linkish" id="change">' + t("a.code.change") + "</button></div>" +
      '<p class="small muted">' + t("a.code.tip") + "</p></div>";
  }
  function refused(key, btns) {
    return '<div class="setup"><div class="sheet-ic is-bad">' + C.icon("warn", 30) + "</div><h2>" + t("a.refused.h") + '</h2><p class="muted" role="alert">' + t(key, { list: providers }) + "</p></div>" + btns;
  }
  function setupView() {
    var out = C.btn(t("p.logout"), { block: true, id: "change" }), retry = C.btn(t("common.retry"), { kind: "primary", block: true, id: "retry" });
    if (S === "refused-used") return refused("a.refused.used", out);
    if (S === "refused-provider") return refused("a.refused.provider", out);
    if (S === "refused-many") return refused("a.refused.many", retry + out);
    if (S === "refused") return refused("a.setup.refused", out);
    if (S === "walletfail" || S === "devicefail") return '<div class="setup"><div class="sheet-ic is-bad">' + C.icon("x", 30) + '</div><h2 role="alert">' + t(S === "walletfail" ? "a.setup.fail" : "a.setup.devicefail") + "</h2></div>" + retry;
    var back = S === "returning", done = back ? 2 : S === "busy" ? 1 : 0;
    return '<div class="setup" role="status"><div class="sheet-ic"><span class="spin"></span></div><h2>' + t("a.setup.h") + '</h2><p class="muted">' + t(back ? "a.setup.body2" : "a.setup.body") + "</p></div>" +
      '<ol class="txsteps" id="setup-steps" data-done="' + done + '">' + ["a.setup.s1", "a.setup.s2", "a.setup.s3"].map(function (k, i) {
        var st = i < done ? "done" : i === done ? "now" : "wait";
        return '<li class="is-' + st + '"><span class="n">' + (st === "done" ? C.icon("check", 16) : i + 1) + "</span><span>" + t(k) + (S === "busy" && i === 1 ? '<br><span class="tiny muted">' + t("a.setup.busy") + "</span>" : "") + '</span><span class="st">' + (st === "now" ? '<span class="spin"></span>' : "") + "</span></li>";
      }).join("") + "</ol>";
  }
  function view() { return step === "email" ? emailView() : step === "code" ? codeView() : setupView(); }
  var raw = '<div class="auth"><div class="gate-bar">' + C.logo() + C.lang() + '</div><div class="auth-main"><div class="stack-12"><h1>' + t("a.h1") + '</h1><p class="auth-lede">' + t("a.lede") + '</p></div><section class="panel" id="panel">' + view() + "</section></div></div>";

  function runSetup() {
    var ol = $("#setup-steps"); if (!ol || S === "busy") return;
    var lis = App.$$("li", ol), i = +ol.getAttribute("data-done");
    (function next() {
      if (i > 0) { lis[i - 1].className = "is-done"; lis[i - 1].querySelector(".n").innerHTML = C.icon("check", 16); lis[i - 1].querySelector(".st").innerHTML = ""; }
      if (i === lis.length) { setTimeout(function () { location.href = S === "returning" ? "home-cards.html" : "first-run.html"; }, 500); return; }
      lis[i].className = "is-now"; lis[i].querySelector(".st").innerHTML = '<span class="spin"></span>'; i++; setTimeout(next, 1000);
    })();
  }
  function paint() { $("#panel").innerHTML = view(); bind(); var f = $("#panel input:not([disabled])"); if (f) f.focus(); }
  function bind() {
    var fe = $("#f-email"), fc = $("#f-code");
    if (fe) fe.addEventListener("submit", function (e) {
      e.preventDefault(); email = $("#email").value.trim(); var err = emailErr(email);
      if (err) { S = err.note ? "unsupported" : email ? "bademail" : "empty"; paint(); return; }
      S = "sending"; paint(); setTimeout(function () { step = "code"; S = "code"; paint(); countdown(); }, 900);
    });
    if (fc) {
      var code = $("#code");
      function submit() { S = "verifying"; paint(); setTimeout(function () { step = "setup"; S = "setup"; paint(); runSetup(); }, 900); }
      code.addEventListener("input", function () { code.value = code.value.replace(/\D/g, "").slice(0, 6); if (code.value.length === 6) submit(); });   /* submits on its own at the last digit */
      fc.addEventListener("submit", function (e) { e.preventDefault(); if (code.value.length < 6) { S = "wrong"; paint(); return; } submit(); });
    }
    var ch = $("#change"); if (ch) ch.addEventListener("click", function () { step = "email"; S = ""; paint(); });
    var rs = $("#resend"); if (rs) rs.addEventListener("click", function () { S = "code"; paint(); countdown(); });
    var rt = $("#retry"); if (rt) rt.addEventListener("click", function () { S = "setup"; paint(); runSetup(); });
  }
  var cdT;
  function countdown() {
    clearInterval(cdT); var s = 60;
    cdT = setInterval(function () {
      var el = $("#resend-in"), rs = $("#resend"); if (!el) { clearInterval(cdT); return; }
      s--; if (s <= 0) { clearInterval(cdT); el.hidden = true; if (rs) rs.disabled = false; } else el.textContent = t("a.code.resendin", { s: s });
    }, 1000);
  }
  App.mount({ bare: true, docTitle: t("a.h1"), raw: raw, after: function () { bind(); if (step === "code" && S !== "expired") countdown(); if (S === "setup" || S === "returning") runSetup(); } });
})();
</script>
</body>
</html>
