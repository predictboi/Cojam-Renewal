<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#124CC4">
<title>H1 Home, card view | Cojam</title>
<link rel="icon" href="assets/cojam-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-jp-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/components.css">
</head>
<body>
<!-- H1 Home, card view. Each pick can be undone for 3 seconds (the bar under the deck), then it is sent. States: (none) ready (continues the picks already made in this tab), fresh (a clean set), noimage (fallback card), imagetop (the other layout), partial, syncing, slow, failed, reconnect, reconnectfail, otherdevice, loading, empty, closed, error, offline. Add ?lang=en|ko|ja. Mock data only. -->
<noscript>Cojam needs JavaScript to show this screen.</noscript>
<script src="assets/i18n.js"></script>
<script src="assets/mock.js"></script>
<script src="assets/components.js"></script>
<script>
(function () {
  var t = App.t, F = App.fmt, S = App.state, M = MOCK, $ = App.$;
  var UNDO_MS = 3000;   /* each pick can be undone for 3 seconds; only then is it sent */
  /* which questions are already answered when the screen opens, per state */
  var sess = App.sess, live = S === "" || S === "fresh";   /* only the plain screen carries real progress; every other state is a fixed preset */
  if (S === "fresh") { sess.resetDay(); S = ""; }
  /* the day is already finished in this tab: home is the day done screen */
  /* picks that were still inside their undo window when the player left this screen were sent at once; coming back says so */
  var leftSaved = live ? sess.takeLeft() : 0;
  if (live && sess.picked() === 5) { location.replace(sess.data.paid ? "done.html" : "done.html?state=moment"); return; }
  var answered = { partial: [1, 2], syncing: [1, 2, 3], slow: [1, 2], failed: [1, 3], offline: [1, 2], reconnect: [1], reconnectfail: [1] }[S] || [];
  /* coming back mid set keeps the progress: picks made earlier in this tab are still answered */
  if (live) answered = M.set.map(function (id, i) { return sess.data.picks[id] ? i + 1 : 0; }).filter(Boolean);
  var sending = S === "syncing" ? [2, 3] : S === "slow" ? [2] : [];
  var Q = M.set.map(App.q);
  var segs = Q.map(function (q) { return sending.indexOf(q.n) >= 0 ? "pend" : answered.indexOf(q.n) >= 0 ? "done" : (S === "failed" && q.n === 2 ? "fail" : ""); });
  var count = answered.length;
  var noSet = S === "empty" || S === "closed" || S === "error" || S === "loading" || S === "otherdevice";

  /* one header pattern: title row (with the view switch), then one status row: counter, day progress, time left */
  function head() {
    var sw = C.viewSwitch("card", S);
    var cd = S === "empty" || S === "closed" ? "" : S === "loading" ? C.skel("96px", "12px") : C.closes(M.untilNextSet());
    return '<div class="ph-top"><h1>' + t("h.title") + "</h1>" + sw + "</div>" +
      '<div class="ph-line"><span class="ph-count"><span id="cnt">' + (S === "loading" ? "0" : count) + "</span><small>/5</small></span>" + C.day5(S === "loading" ? ["", "", "", "", ""] : segs, { band: true, id: "day5" }) + cd + "</div>";
  }
  function body() {
    if (S === "loading") return '<div class="deck" aria-busy="true"><div class="qcard" data-pos="0"><div class="qimg"></div><div class="qcard-top">' + C.skel("72px", "28px") + C.skel("52px", "28px") +
      '</div><div class="qcard-body">' + C.skel("92%", "22px") + C.skel("60%", "22px") + '<div class="qcard-meta">' + C.skel("80%") + C.skel("66%") + '</div><div class="choices">' + C.skel("100%", "54px") + C.skel("100%", "54px") + '</div></div></div></div><p class="sr-only" role="status">' + t("common.loading") + "</p>";
    if (S === "empty") return C.empty({ icon: "clock", title: t("h.empty.h"), body: t("h.empty.b", { time: t("time.kst9") }), extra: '<p class="fig fig--md" data-cd="' + M.untilNextSet() + '"></p>' });
    if (S === "closed") return C.empty({ icon: "refresh", title: t("h.closed"), action: C.btn(t("h.closed.btn"), { kind: "primary", href: "home-cards.html" }) });
    if (S === "error") return C.error();
    if (S === "otherdevice") return C.otherDevice();
    var cards = Q.filter(function (q) { return answered.indexOf(q.n) < 0; });
    if (S === "failed") cards.sort(function (a, b) { return (a.n === 2 ? -1 : 0) - (b.n === 2 ? -1 : 0); });
    /* offline: the bar under the header says so, the answers are drawn switched off, and a tap on one says why */
    return C.playBanner(S) +
      /* behind the last card: the countdown of the fifth pick (a ring and "Finishing in 3") and a button that ends the wait */
      '<div class="deck" id="deck"><div class="deck-end" id="deck-end" aria-hidden="true"><div class="end-ring" aria-hidden="true"><svg class="ring" viewBox="0 0 92 92"><circle class="trk" cx="46" cy="46" r="40"/><circle class="run" id="end-run" cx="46" cy="46" r="40"/></svg>' + C.icon("check", 32) + "</div>" +
      "<h2>" + t("h.end.h") + '</h2><p id="end-p"></p><div id="end-act"></div></div>' +
      cards.map(function (q) { return C.qcard(q.id, { failed: S === "failed" && q.n === 2, disabled: App.offline, noimg: S === "noimage" && q.n === 1, top: S === "imagetop", final: true }); }).join("") + "</div>" +
      '<div class="pickbar" id="pickbar"></div>';
  }

  App.mount({ tab: "home", cls: "is-home" + (App.offline ? " is-offline" : ""), docTitle: t("h.title"), head: head(), body: body(), badges: { home: 5 - count ? "dot" : 0, results: 2 }, after: function () {
    var deckEl = $("#deck"); if (!deckEl) return;
    var day5 = $("#day5"), cnt = $("#cnt"), bar = $("#pickbar");
    if (S === "failed") { App.toast(t("h.toast.fail", { n: 2 }), { btn: t("common.retry") }); }
    if (leftSaved) App.toast(leftSaved > 1 ? t("h.left.savedn", { n: leftSaved }) : t("h.left.saved"));

    /* picks still inside their undo window, oldest first. Undo always acts on the last one. */
    var held = [], shown = null, fade;
    function label(p) { return t("h.sync", { n: p.n, choice: C.pick(p.dir, App.esc(App.q(p.id)[p.dir])) }); }
    function seg(n, cls) { day5.children[n - 1].className = cls; }
    /* at rest the bar is not an empty band: it says how to pick (touch or keys), then how many are left */
    var canHover = matchMedia("(hover: hover) and (pointer: fine)").matches;
    function rest() {
      if (App.offline) return "";
      var left = 5 - count;
      if (count === 0) return '<span class="pickbar-hint">' + C.icon("left", 14) + "<span>" + t(canHover ? "h.hint.keys" : "h.hint.touch") + "</span>" + C.icon("right", 14) + "</span>";
      return left ? '<span class="pickbar-hint"><span>' + t("h.left", { n: left }) + "</span></span>" : "";
    }
    /* the finishing panel behind the last card: the time left of the newest held pick, as a ring and a number */
    var endEl = $("#deck-end"), endP = $("#end-p"), endRun = $("#end-run"), endAct = $("#end-act"), endT, endFor = null;
    /* the button exists only while there is a wait to end, so the home screen carries no lime at rest */
    function finishBtn(on) { if (on === !!endAct.firstChild) return; endAct.innerHTML = on ? C.btn(t("h.end.now"), { kind: "primary", id: "finish" }) : ""; }
    function endPanel() {
      var p = held[held.length - 1], on = count === 5 && !!deck && !deck.live().length;
      endEl.setAttribute("aria-hidden", on ? "false" : "true");
      clearInterval(endT);
      if (!on) { endFor = null; finishBtn(false); return; }
      if (!p) { endP.textContent = t("h.end.b"); endRun.style.animation = "none"; endRun.style.strokeDashoffset = 251.4; finishBtn(false); endFor = null; return; }
      finishBtn(true);
      if (endFor !== p) { endFor = p; endRun.style.strokeDashoffset = ""; endRun.style.animation = "none"; void endRun.getBoundingClientRect(); endRun.style.animation = ""; endRun.style.animationDuration = UNDO_MS + "ms"; endRun.style.animationDelay = "-" + (Date.now() - p.t0) + "ms"; }
      function tick() { endP.innerHTML = t("h.end.in", { n: "<b>" + Math.max(1, Math.ceil((UNDO_MS - (Date.now() - p.t0)) / 1000)) + "</b>" }); }
      tick(); endT = setInterval(tick, 100);
    }
    function render() {
      endPanel();
      clearTimeout(fade);
      var p = held[held.length - 1];
      if (p) {
        var gone = Date.now() - p.t0;
        bar.innerHTML = '<span class="pickbar-msg" id="pick-msg">' + C.icon("check", 16) + "<span>" + label(p) + "</span></span>" +
          '<button type="button" class="undo" id="undo" aria-label="' + App.esc(t("h.undo.aria", { n: p.n, choice: App.q(p.id)[p.dir] })) + '">' +
          '<svg class="undo-ring" viewBox="0 0 22 22" aria-hidden="true"><circle class="trk" cx="11" cy="11" r="8"/><circle class="run" cx="11" cy="11" r="8" style="animation-duration:' + UNDO_MS + "ms;animation-delay:-" + gone + 'ms"/></svg><span>' + t("h.undo") + '</span><kbd aria-hidden="true">Z</kbd></button>';
        return;
      }
      if (shown && shown.state === "saving") { bar.innerHTML = '<span class="pickbar-msg is-quiet" role="status"><span class="spin"></span><span>' + t("common.saving") + ": " + label(shown) + "</span></span>"; return; }
      if (shown && shown.state === "saved") {
        bar.innerHTML = '<span class="pickbar-msg is-quiet" role="status">' + C.icon("check", 16) + "<span>" + t("h.saved") + ": " + label(shown) + "</span></span>";
        fade = setTimeout(function () { var m = $(".pickbar-msg", bar); if (m) m.classList.add("is-out"); fade = setTimeout(function () { if (!held.length && shown && shown.state === "saved") { shown = null; render(); } }, 400); }, 1200);
        return;
      }
      bar.innerHTML = rest();
    }
    var leaving = false;
    function finishDay(now) { if (count === 5 && !held.length && !leaving) { leaving = true; setTimeout(function () { location.href = "done.html?state=moment"; }, now || App.reduce ? 0 : 500); } }
    /* "Finish now": every pick still inside its undo window is sent at once and the day done screen opens */
    function finishNow() { held.slice().forEach(function (p) { clearTimeout(p.timer); held.splice(held.indexOf(p), 1); p.state = "saving"; shown = p; }); render(); finishDay(true); }
    /* leaving the screen inside an undo window: the held picks are sent at once, and home says "Pick saved" on return */
    window.addEventListener("pagehide", function () { if (live && held.length && !leaving) sess.leave(held.length); });
    /* the undo window closed: now the pick is sent (optimistic, in the background) */
    function send(p) {
      held.splice(held.indexOf(p), 1);
      p.state = "saving"; shown = p; render();
      setTimeout(function () { p.state = "saved"; seg(p.n, "is-done is-fill"); if (shown === p) render(); }, 900 + Math.random() * 500);
      finishDay();
    }
    var deck = App.deck(deckEl, {
      disabled: function () { return App.offline; },
      onBlocked: function () { App.toast(t("h.offline"), { key: "offline" }); },   /* offline: the answers look switched off, and a tap says why */
      onCommit: function (n, dir, remaining, card) {
        var p = { n: n, id: card.getAttribute("data-id"), dir: dir, card: card, t0: Date.now(), state: "held" };
        p.timer = setTimeout(function () { send(p); }, UNDO_MS);
        held.push(p);
        if (live) { sess.data.picks[p.id] = dir; sess.save(); }   /* carried to the day done screen and back to home */
        stopNudge();
        seg(n, "is-pend"); count++; cnt.textContent = count;
        render();
        App.live(t("h.live.picked", { choice: App.q(p.id)[dir], k: remaining }));
      }
    });
    function undo() {
      var p = held.pop(); if (!p) return;
      clearTimeout(p.timer);
      if (live) { delete sess.data.picks[p.id]; sess.save(); }
      seg(p.n, ""); count--; cnt.textContent = count;
      deck.restore(p.card, p.dir);
      render();   /* an earlier pick still inside its window takes the bar, with the time it has left */
      App.live(t("h.undone", { n: p.n }));
    }
    bar.addEventListener("click", function (e) { if (e.target.closest("#undo")) undo(); });
    endAct.addEventListener("click", function (e) { if (e.target.closest("#finish")) finishNow(); });
    /* Undo from the keyboard while the window is open: Z or Backspace (the hint sits on the button on devices with a pointer) */
    document.addEventListener("keydown", function (e) {
      if ((e.key !== "z" && e.key !== "Z" && e.key !== "Backspace") || e.repeat || e.altKey || e.ctrlKey || e.metaKey || !held.length || $("#sheet-root.is-open")) return;
      var a = document.activeElement; if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
      e.preventDefault(); undo();
    });
    /* the very first card a player ever sees leans right, then left, once: it teaches the throw. Never under reduced motion, never again. */
    var nudge = [];
    function stopNudge() { nudge.forEach(function (a) { try { a.cancel(); } catch (e) {} }); nudge = []; deckEl.removeAttribute("data-nudge"); }
    if (live && count === 0 && !App.reduce && !App.offline && App.store.get("nudged", "") !== "1") {
      setTimeout(function () {
        var card = $('.qcard[data-pos="0"]', deckEl); if (!card || count || card.classList.contains("is-drag") || !card.animate) return;
        App.store.set("nudged", "1"); deckEl.setAttribute("data-nudge", "1");
        var o = { duration: 1500, easing: "cubic-bezier(0.45, 0, 0.25, 1)" };
        nudge = [card.animate([{ transform: "none" }, { transform: "translateX(34px) rotate(2.6deg)", offset: 0.24 }, { transform: "translateX(34px) rotate(2.6deg)", offset: 0.4 }, { transform: "translateX(-34px) rotate(-2.6deg)", offset: 0.68 }, { transform: "translateX(-34px) rotate(-2.6deg)", offset: 0.82 }, { transform: "none" }], o),
          $(".qstamp--r", card).animate([{ opacity: 0 }, { opacity: 0.4, offset: 0.24 }, { opacity: 0.4, offset: 0.4 }, { opacity: 0, offset: 0.52 }, { opacity: 0 }], o),
          $(".qstamp--l", card).animate([{ opacity: 0 }, { opacity: 0, offset: 0.54 }, { opacity: 0.4, offset: 0.68 }, { opacity: 0.4, offset: 0.82 }, { opacity: 0 }], o)];
        nudge[0].onfinish = stopNudge;
      }, 700);
    }
    deckEl.addEventListener("pointerdown", stopNudge, true);
    document.addEventListener("keydown", stopNudge, true);
    render();
    deckEl.focus({ preventScroll: true });   /* arrow keys pick at once, no tabbing into the card */

    document.addEventListener("click", function (e) {   /* "Retry now" on the slow pick banner */
      if (!e.target.closest("[data-retry-now]")) return;
      setTimeout(function () { seg(2, "is-done is-fill"); var b = $(".banner"); if (b) b.remove(); }, 900);
    });
    /* picks that were already being sent when the screen opened (syncing state) confirm after a moment */
    if (sending.length) { shown = { n: sending[sending.length - 1], id: "q" + sending[sending.length - 1], dir: "r", state: "saving" }; render(); }
    if (S !== "slow") sending.forEach(function (n, i) { setTimeout(function () { seg(n, "is-done is-fill"); if (shown && shown.n === n) { shown.state = "saved"; render(); } }, 2600 + i * 1400); });
  } });
})();
</script>
</body>
</html>
