<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#124CC4">
<title>H3 Day done with countdown | Cojam</title>
<link rel="icon" href="assets/cojam-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-jp-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/components.css">
</head>
<body>
<!-- H3 Day done with countdown. States: (none) paid, moment (plays saving, then paid), saving, results, zero, offline. Add ?lang=en|ko|ja. Mock data only. -->
<noscript>Cojam needs JavaScript to show this screen.</noscript>
<script src="assets/i18n.js"></script>
<script src="assets/mock.js"></script>
<script src="assets/components.js"></script>
<script>
(function () {
  var t = App.t, F = App.fmt, S = App.state, M = MOCK, $ = App.$;
  var sess = App.sess;
  if (S === "moment" && sess.data.paid) S = "";   /* the reward moment plays once; a reload shows the settled screen */
  var phase = S === "moment" || S === "saving" ? "saving" : "paid";
  /* points: the 100P already counted in this tab is in M.user.points; a preset opened on its own adds it for the picture */
  var basePts = phase === "paid" && !sess.data.paid ? M.user.points + 100 : M.user.points;
  if (phase === "paid") M.user.points = basePts;
  /* the picks are the ones actually made on the home screen in this tab; a preset opened on its own falls back to sample picks */
  var sample = { q1: "r", q2: "r", q3: "l", q4: "r", q5: "r" };
  var picks = M.set.map(function (id) { return [id, sess.data.picks[id] || sample[id]]; });
  var outcome = S === "results" ? ["wait", "pend", "miss", "wait", "wait"] : ["wait", "wait", "wait", "wait", "wait"];
  var waiting = outcome.filter(function (o) { return o === "wait"; }).length;

  /* the one reward moment: badge and chip flash lime as they pop, then settle to white and ink, so at rest the progress band and
     the primary button are the only lime. No toast repeats it; the header pill counts up instead. */
  function reward(p) {
    if (p === "saving") return '<p class="reward" id="reward"><span class="spin"></span>' + t("d.saving") + "</p>";
    return '<p class="reward is-paid" id="reward">' + C.icon("check", 16) + t("d.paid") + "</p>";
  }
  function head() {
    var segs = phase === "saving" ? ["done", "done", "done", "done", "pend"] : ["done", "done", "done", "done", "done"];
    return '<div class="ph-top"><h1>' + t("d.h1") + '</h1><span class="done-badge' + (S === "moment" ? " is-pop" : "") + '" aria-hidden="true">' + C.icon("check", 26) + "</span></div>" +
      '<div class="ph-line"><span class="ph-count">5<small>/5</small></span>' + C.day5(segs, { band: true, id: "day5", cls: S === "moment" ? "is-flash" : "", label: "5/5" }) + "</div>" +
      '<div aria-live="polite" id="reward-wrap">' + reward(phase) + "</div>";
  }
  function pickRow(p, i) {
    var o = outcome[i], q = App.q(p[0]);
    var sub = o === "pend" ? t("d.hitpending", { time: "22:10" }) : o === "miss" ? t("d.miss") : "";
    return '<li class="pick"><span class="pick-q">' + App.esc(q.title) + '</span><span class="pick-c">' + App.esc(q[p[1]]) + (sub ? "<small>" + sub + "</small>" : "") + "</span></li>";
  }
  function body() {
    var secs = S === "zero" ? 0 : M.untilNextSet();
    /* the countdown is one compact row (label left, time right), so the picks list starts higher */
    return '<section class="card card--ink clock-row" aria-label="' + t("d.next") + '"><p class="card-h">' + C.icon("clock", 16) + t("d.next") + "</p>" +
      (S === "zero" ? '<p class="watch"><span class="spin"></span>' + t("d.loading") + "</p>" :
        '<p class="fig fig--md" id="clock" data-cd="' + secs + '" aria-hidden="true"></p><p class="sr-only" data-cd-sr></p>') + "</section>" +
      C.btn(t("d.rank"), { kind: "primary", block: true, href: "ranking.html", iconEnd: "right" }) +
      '<section class="stack-12"><div class="sect-h"><h2 class="sect-h">' + t("d.picks") + '</h2><span class="muted">' + (waiting ? t("d.waitn", { n: waiting }) : "") + "</span></div>" +
      '<ul class="list">' + picks.map(pickRow).join("") + "</ul>" +
      C.note("", t("d.hit"), '<a class="linkish" href="results.html">' + t("d.results") + "</a>") + "</section>";
  }
  App.mount({ tab: "home", docTitle: t("d.h1"), head: head(), body: body(), points: basePts, pts: phase === "saving" ? "pending" : S === "results" ? "hits" : "", badges: { results: 2 }, after: function () {
    document.addEventListener("cd:zero", function () { if (S !== "zero") setTimeout(function () { location.href = "home-cards.html"; }, 1200); });
    if (S === "zero") setTimeout(function () { App.toast(t("h.new")); }, 600);
    if (S !== "moment") return;
    /* the day done moment: the fifth pick is mined (the 100P is credited in that same transaction), only then "+100P paid" and the count up */
    var day5 = $("#day5"), wrap = $("#reward-wrap");
    setTimeout(function () { day5.children[4].className = "is-done is-fill"; }, 800);
    setTimeout(function () { var sp = App.$("#pts .spin"); if (sp) sp.remove(); wrap.innerHTML = reward("paid"); App.$("#reward").classList.add("is-pop"); sess.data.paid = true; sess.save(); day5.classList.remove("is-flash"); day5.classList.add("is-wave"); App.burst(App.$(".done-badge"), 18); try { if (navigator.vibrate) navigator.vibrate([12, 40, 18]); } catch (e) {} App.addPoints(100); App.live(t("toast.paid", { n: 100 })); }, 1500);
  } });
})();
</script>
</body>
</html>
