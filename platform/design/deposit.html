<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#124CC4">
<title>W3 Deposit | Cojam</title>
<link rel="icon" href="assets/cojam-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-jp-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/components.css">
</head>
<body>
<!-- W3 Deposit. States: (none) waiting, arrived, loading, error, offline. Add ?lang=en|ko|ja. Mock data only. -->
<noscript>Cojam needs JavaScript to show this screen.</noscript>
<script src="assets/i18n.js"></script>
<script src="assets/mock.js"></script>
<script src="assets/components.js"></script>
<script>
(function () {
  var t = App.t, F = App.fmt, S = App.state, M = MOCK, $ = App.$, a = M.user.address;
  function body() {
    if (S === "error") return '<div class="card">' + C.note("error", t("dp.err"), C.btn(t("common.retry"), { sm: true, icon: "refresh", attrs: "data-reload" })) + "</div>";
    var qr = S === "loading" ? '<div class="qr" aria-busy="true">' + C.skel("100%", "auto") + "</div>" : C.qr(a, t("dp.qr"));
    return '<p class="lead">' + t("dp.lead") + "</p>" + qr +
      (S === "loading" ? '<div class="addr addr--lg">' + C.skel("100%", "44px") + "</div>" : C.addr(a, { lg: true })) +
      C.btn(t("w.copy"), { kind: "primary", block: true, icon: "copy", attrs: 'data-copy="' + a + '" data-toast="' + App.esc(t("w.copied", { a: "<b>" + F.short(a) + "</b>" })) + '" data-done="' + App.esc(t("w.copy.done")) + '"', disabled: S === "loading" }) +
      '<p class="watch" id="watch" role="status">' + (App.offline ? C.icon("offline", 16) + "<span>" + t("dp.offline") + "</span>" : '<span class="live-dot"></span><span>' + t("dp.watch") + "</span>") + "</p>" +
      '<section class="card card--mist">' + C.rows([[t("dp.net"), t("dp.net.v")], [t("dp.token"), t("dp.token.v") + '<small class="mono" translate="no">' + M.token + "</small>"]]) + "</section>" +
      '<div class="note note-warn">' + C.icon("warn", 18) + '<div class="note-body"><ul><li>' + t("dp.w1") + "</li><li>" + t("dp.w2") + ' <a href="https://cojam.app/migrate/" target="_blank" rel="noopener">' + t("g.swap.btn") + "</a></li><li>" + t("dp.w3") + "</li></ul></div></div>" +
      '<div class="two">' + C.btn(t("dp.share"), { icon: "share", id: "share" }) + C.btn(t("common.copy") + " CT", { icon: "copy", attrs: 'data-copy="' + M.token + '" data-toast="' + App.esc(t("common.copied")) + '" aria-label="' + App.esc(t("w.token.copy")) + '"' }) + "</div>";
  }
  App.mount({ tab: "wallet", back: "wallet.html", title: t("dp.title"), body: body(), pts: S === "loading" ? "loading" : "", badges: { home: "dot", results: 2 }, after: function () {
    var sh = $("#share"); if (sh) sh.addEventListener("click", function () { if (navigator.share) navigator.share({ text: a }).catch(function () {}); else { try { navigator.clipboard.writeText(a); } catch (e) {} App.toast(t("w.copied")); } });
    if (S === "arrived") setTimeout(function () {
      $("#watch").innerHTML = C.tag(t("dp.arrived", { a: "250" }), "up", "check"); App.toast(t("dp.toast", { a: "250" }));
    }, 1400);
  } });
})();
</script>
</body>
</html>
