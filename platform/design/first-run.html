<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#124CC4">
<title>A2 First run | Cojam</title>
<link rel="icon" href="assets/cojam-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-jp-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/components.css">
</head>
<body>
<!-- A2 First run. States: 1 (default), 2, 3, settingup (setup still running when the last button is tapped). Add ?lang=en|ko|ja. Mock data only. -->
<noscript>Cojam needs JavaScript to show this screen.</noscript>
<script src="assets/i18n.js"></script>
<script src="assets/mock.js"></script>
<script src="assets/components.js"></script>
<script>
(function () {
  var t = App.t, S = App.state, M = MOCK, $ = App.$, I = CJ_I18N;
  var n = +S >= 1 && +S <= 3 ? +S : S === "settingup" ? 3 : 1;
  var from = new URLSearchParams(location.search).get("from"), exit = from === "profile" ? "profile.html" : "home-cards.html";
  function art(i) {
    if (i === 1) return '<div class="art-fig"><div class="art-cards" aria-hidden="true"><i></i><i>' + C.icon("swap", 40) + "</i></div>" + C.day5(["done", "done", "pend", "", ""], { label: " " }) + "</div>";
    if (i === 2) return '<div class="art-fig"><div class="two"><div><p class="fig">+100P</p><p class="small muted">' + t("o.2.a") + '</p></div><div><p class="fig">+50P</p><p class="small muted">' + t("o.2.c") + "</p></div></div>" + C.day5(["done", "done", "done", "done", "done"], { label: " " }) + "</div>";
    return '<div class="art-swap" aria-hidden="true"><span class="art-coin">1,000P</span>' + C.icon("right", 28) + '<span class="art-coin">1 CT</span></div>';
  }
  function panel(i) {
    return '<li class="onb"' + (i === n ? "" : " hidden") + ' data-panel="' + i + '"><div class="onb-art">' + art(i) + '</div><div class="stack-12"><p class="onb-n" aria-hidden="true">0' + i + '</p><h1 tabindex="-1">' + t("o." + i + ".h") + '</h1><p class="auth-lede">' + t("o." + i + ".b") + "</p>" +
"</div></li>";
  }
  var raw = '<div class="auth auth--onb"><div class="gate-bar"><div class="dots" role="img" aria-label="' + t("o.step", { n: n }) + '" id="dots">' + [1, 2, 3].map(function (i) { return "<i" + (i === n ? ' class="is-on"' : "") + "></i>"; }).join("") + "</div>" +
    '<a class="btn btn-onband btn-sm" href="' + exit + '">' + t("o.skip") + '</a></div><div class="onb-wrap"><ol id="panels">' + [1, 2, 3].map(panel).join("") + "</ol>" +
    '<div class="onb-foot"><div id="langrow"' + (n === 1 ? "" : " hidden") + ">" + C.seg(I.langs.map(function (l) { return { label: I.names[l], value: l, on: l === App.lang }; }), { name: "lang", label: t("lang.label") }) + "</div>" +
    C.btn(t(n === 3 ? "o.start" : "o.next"), { kind: "primary", block: true, id: "next", iconEnd: "right" }) +
    '<p class="row small on-band-2 setup-line" id="setup-line" role="status"><span class="spin"></span><span>' + t("a.setup.h") + "</span></p></div></div></div>";
  App.mount({ bare: true, docTitle: t("o.1.h"), raw: raw, after: function () {
    /* setup (wallet, registration, play key) runs behind the panels; the last button waits for it if it is not done */
    var ready = from === "profile", waiting = false, line = $("#setup-line");
    function setReady() { ready = true; line.innerHTML = C.icon("check", 16) + "<span>" + t("o.3.wait") + "</span>"; if (waiting) location.href = exit; }
    if (ready) line.hidden = true; else setTimeout(setReady, S === "settingup" ? 9000 : 3200);
    function leave() { if (ready) { location.href = exit; return; } waiting = true; var b = $("#next"); b.classList.add("is-loading"); b.innerHTML = '<span class="spin"></span><span>' + t("a.setup.h") + "</span>"; }
    function go(i) {
      if (i < 1) return; if (i > 3) { leave(); return; }
      n = i; App.$$("[data-panel]").forEach(function (p) { p.hidden = +p.getAttribute("data-panel") !== n; });
      App.$$("#dots i").forEach(function (d, k) { d.classList.toggle("is-on", k === n - 1); }); $("#dots").setAttribute("aria-label", t("o.step", { n: n }));
      $("#langrow").hidden = n !== 1; $("#next span").textContent = t(n === 3 ? "o.start" : "o.next");
      var h = $('[data-panel="' + n + '"] h1'); if (h) h.focus({ preventScroll: true });
    }
    $("#next").addEventListener("click", function () { go(n + 1); });
    document.addEventListener("seg", function (e) { if (e.detail.name === "lang") { var u = new URL(location.href); u.searchParams.set("state", n); history.replaceState(null, "", u); I.setLang(e.detail.value); } });
    var x0 = null, pn = $("#panels");
    pn.addEventListener("pointerdown", function (e) { x0 = e.clientX; });
    pn.addEventListener("pointerup", function (e) { if (x0 === null) return; var d = e.clientX - x0; x0 = null; if (d < -60) go(n + 1); else if (d > 60) go(n - 1); });
    document.addEventListener("keydown", function (e) { if (e.key === "ArrowRight") go(n + 1); if (e.key === "ArrowLeft") go(n - 1); });
  } });
})();
</script>
</body>
</html>
