# Render Blueprint for the Cojam site.
# Connect this repository in the Render dashboard (New, Blueprint) once the branch is merged to main.
# Phase 1 is a static site served from ./site. When the app needs a server (wallet API, indexer),
# add a second service here instead of changing this one.
services:
  - type: web
    name: cojam-site
    runtime: static
    buildCommand: echo "static site, no build step"
    staticPublishPath: ./site
    autoDeployTrigger: commit
    previews:
      generation: automatic
    buildFilter:
      paths:
        - site/**
        - render.yaml
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /ko
        destination: /index.html
      - type: rewrite
        source: /ja
        destination: /index.html
